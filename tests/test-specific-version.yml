name: Test UPX specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: upx
        uses: .
        with:
          version: 'v4.2.4'
          install-only: 'true'

      - name: Assert UPX 4.2.4 is installed
        run: |
          if ! command -v upx > /dev/null 2>&1; then
            echo "FAIL: upx not found on PATH"
            exit 1
          fi
          UPX_VERSION=$(upx --version 2>&1 | head -1)
          echo "UPX version output: $UPX_VERSION"
          if ! echo "$UPX_VERSION" | grep -q "4.2.4"; then
            echo "FAIL: expected version 4.2.4 but got: $UPX_VERSION"
            exit 1
          fi
          echo "PASS: upx 4.2.4 is installed"
